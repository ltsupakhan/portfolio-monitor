<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Monitor</title>
  <style>
    body {
      background-color: #0f1117;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
    }
    h1 { color: #00d4aa; margin-bottom: 8px; }
    #last-updated { color: #666; font-size: 13px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th {
      background-color: #1e2130;
      color: #a0aec0;
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      text-transform: uppercase;
    }
    td { padding: 12px 16px; border-bottom: 1px solid #2d3748; }
    tr:hover { background-color: #1a1f2e; }
    .positive { color: #48bb78; }   /* กำไร = เขียว */
    .negative { color: #fc8181; }   /* ขาดทุน = แดง */
    .loading { color: #a0aec0; font-style: italic; }
    #refresh-btn {
      margin-bottom: 20px;
      padding: 8px 20px;
      background: #00d4aa;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #refresh-btn:hover { background: #00b894; }
/* ---- Summary Cards ---- */
.summary-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
}
.card {
  background: #1e2130;
  border-radius: 10px;
  padding: 16px 24px;
  flex: 1;
}
.card .label {
  color: #a0aec0;
  font-size: 12px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.card .value {
  font-size: 22px;
  font-weight: bold;
}

  </style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>📊 Portfolio ของฉัน</h1>
  <p id="last-updated">กำลังโหลด...</p>
  <button id="refresh-btn" onclick="loadPrices()">🔄 Refresh ราคา</button>

<div class="summary-bar">
  <div class="card">
    <div class="label">💰 ต้นทุนรวม</div>
    <div class="value" id="total-cost">-</div>
  </div>
  <div class="card">
    <div class="label">📈 มูลค่าปัจจุบัน</div>
    <div class="value" id="total-value">-</div>
  </div>
  <div class="card">
    <div class="label">🏆 กำไร/ขาดทุนรวม</div>
    <div class="value" id="total-pnl">-</div>
  </div>
</div>
<div style="width: 340px; margin: 0 auto 32px auto;">
  <canvas id="pieChart"></canvas>
</div>

  <table>
    <thead>
      <tr>
        <th>Ticker</th>
        <th>ประเภท</th>
        <th>จำนวน</th>
        <th>ราคาทุน (USD)</th>
        <th>ราคาปัจจุบัน (USD)</th>
        <th>กำไร/ขาดทุน</th>
      </tr>
    </thead>
    <tbody id="portfolio-body">
    </tbody>
  </table>

  <script>
    // ============================================
    // 📋 ข้อมูล Portfolio ของเรา — แก้ตรงนี้ได้เลย
    // ============================================
    const portfolio = [
      { ticker: "RTX",  type: "หุ้น US", qty: 10,  costPrice: 120  },
      { ticker: "LMT",  type: "หุ้น US", qty: 5,   costPrice: 450  },
      { ticker: "LDOS", type: "หุ้น US", qty: 8,   costPrice: 95   },
      { ticker: "ITA",  type: "ETF",    qty: 15,  costPrice: 130  },
      { ticker: "QQQI", type: "ETF",    qty: 20,  costPrice: 50   },
      { ticker: "BTC",  type: "Crypto", qty: 0.5, costPrice: 60000 },
    ];

    // ============================================
    // ดึงราคาหุ้น US / ETF จาก Yahoo Finance
    // ============================================
    const FINNHUB_KEY = "d8l3c5hr01qut1f8ovc0d8l3c5hr01qut1f8ovcg";

async function fetchStockPrice(ticker) {
  const res = await fetch(
    `https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`
  );
  const data = await res.json();
  return data.c;
}

    // ============================================
    // ดึงราคา BTC จาก CoinGecko
    // ============================================
    async function fetchBTCPrice() {
      const res = await fetch(
        "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"
      );
      const data = await res.json();
      return data.bitcoin.usd;
    }

    // ============================================
    // โหลดราคาทั้งหมดแล้วแสดงในตาราง
    // ============================================
    async function loadPrices() {
      const tbody = document.getElementById("portfolio-body");
      tbody.innerHTML = ""; // ล้างตารางก่อน

      // แสดง loading ก่อน
      portfolio.forEach(item => {
        const row = document.createElement("tr");
        row.id = "row-" + item.ticker;
        row.innerHTML = `
          <td><b>${item.ticker}</b></td>
          <td>${item.type}</td>
          <td>${item.qty}</td>
          <td>$${item.costPrice.toLocaleString()}</td>
          <td class="loading">กำลังโหลด...</td>
          <td class="loading">-</td>
        `;
        tbody.appendChild(row);
      });

      // ดึงราคาแต่ละตัว
      for (const item of portfolio) {
        try {
          let currentPrice;

          if (item.type === "Crypto") {
            currentPrice = await fetchBTCPrice();
          } else {
            currentPrice = await fetchStockPrice(item.ticker);
          }

          const pnl = (currentPrice - item.costPrice) * item.qty;
          const pnlPct = ((currentPrice - item.costPrice) / item.costPrice * 100).toFixed(2);
          const isPositive = pnl >= 0;

          const row = document.getElementById("row-" + item.ticker);
          row.cells[4].textContent = "$" + currentPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
          row.cells[4].className = "";
          row.cells[5].textContent = (isPositive ? "+" : "") + "$" + pnl.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ` (${isPositive ? "+" : ""}${pnlPct}%)`;
          row.cells[5].className = isPositive ? "positive" : "negative";

        } catch (err) {
          const row = document.getElementById("row-" + item.ticker);
          row.cells[4].textContent = "Error";
          row.cells[5].textContent = "ดึงข้อมูลไม่ได้";
        }
      }

      // อัปเดตเวลา
      document.getElementById("last-updated").textContent =
        "อัปเดตล่าสุด: " + new Date().toLocaleTimeString("th-TH");
// คำนวณ summary
let totalCost = 0;
let totalValue = 0;

portfolio.forEach(item => {
  const row = document.getElementById("row-" + item.ticker);
  const priceText = row.cells[4].textContent.replace(/[$,]/g, "");
  const currentPrice = parseFloat(priceText);
  if (!isNaN(currentPrice)) {
    totalCost  += item.costPrice * item.qty;
    totalValue += currentPrice * item.qty;
  }
});

const totalPnl = totalValue - totalCost;
const totalPct = (totalPnl / totalCost * 100).toFixed(2);
const isPos = totalPnl >= 0;

document.getElementById("total-cost").textContent =
  "$" + totalCost.toLocaleString(undefined, {minimumFractionDigits: 2});
document.getElementById("total-value").textContent =
  "$" + totalValue.toLocaleString(undefined, {minimumFractionDigits: 2});
document.getElementById("total-pnl").textContent =
  (isPos ? "+" : "") + "$" + totalPnl.toLocaleString(undefined, {minimumFractionDigits: 2}) + ` (${isPos ? "+" : ""}${totalPct}%)`;
document.getElementById("total-pnl").className =
  "value " + (isPos ? "positive" : "negative");

// ---- วาด Pie Chart ----
const labels = [];
const values = [];
const colors = [
  "#00d4aa", "#4299e1", "#f6ad55",
  "#fc8181", "#b794f4", "#68d391"
];

portfolio.forEach(item => {
  const row = document.getElementById("row-" + item.ticker);
  const priceText = row.cells[4].textContent.replace(/[$,]/g, "");
  const currentPrice = parseFloat(priceText);
  if (!isNaN(currentPrice)) {
    labels.push(item.ticker);
    values.push((currentPrice * item.qty).toFixed(2));
  }
});

// ถ้ามี chart เก่าอยู่ ให้ destroy ก่อน
if (window.portfolioChart) {
  window.portfolioChart.destroy();
}

const ctx = document.getElementById("pieChart").getContext("2d");
window.portfolioChart = new Chart(ctx, {
  type: "doughnut",
  data: {
    labels: labels,
    datasets: [{
      data: values,
      backgroundColor: colors,
      borderColor: "#0f1117",
      borderWidth: 3,
    }]
  },
  options: {
    plugins: {
      legend: {
        position: "bottom",
        labels: {
          color: "#ffffff",
          padding: 16,
          font: { size: 13 }
        }
      },
      tooltip: {
        callbacks: {
          label: (ctx) => {
            const total = ctx.dataset.data.reduce((a, b) => +a + +b, 0);
            const pct = ((ctx.raw / total) * 100).toFixed(1);
            return ` $${parseFloat(ctx.raw).toLocaleString()} (${pct}%)`;
          }
        }
      }
    }
  }
});

    }

    // โหลดอัตโนมัติตอนเปิดหน้า
    loadPrices();
// Auto-refresh ทุก 60 วินาที
setInterval(loadPrices, 60000);
  </script>

</body>
</html>
